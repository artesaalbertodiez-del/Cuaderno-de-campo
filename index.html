<script>
/* =========================================================================
   Exportación a Word — replica exacta de la plantilla aprobada
   (Modelo_Ficha_Seguimiento_DAO.docx / build.js) usando docx@7.8.2 (CDN).
   ========================================================================= */

const VERDE = "8DC63F";
const VERDE_OSC = "5A8A1F";
const INK = "2B2E28";
const INK_MUTED = "6B7268";
const LINE = "D9D2BD";
const GOOD_BG = "E4F1DB", GOOD_TX = "3F7D22";
const BAD_BG = "F8E3E0", BAD_TX = "A83D30";
const NA_BG = "ECEAE2", NA_TX = "80786A";
const HEAD_BG = "F3F1E9";
const S9=18,S10=20,S10_5=21,S11=22,S12=24,S20=40;

const cmToPx = cm => Math.round(cm * 96 / 2.54);
const ENGIE_PX  = { w: cmToPx(3.3), h: cmToPx(1.31) };
const ARTESA_PX = { w: cmToPx(3.0), h: cmToPx(1.28) };

function b64ToUint8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function itemsForFaseDoc(all, fase){
  return all.filter(it => it.fase === "ambas" || it.fase === fase);
}

function estadoBadge(estado){
  const map = {
    cumple:   { label:"CUMPLE",    bg:GOOD_BG, tx:GOOD_TX },
    no_cumple:{ label:"NO CUMPLE", bg:BAD_BG,  tx:BAD_TX  },
    na:       { label:"N/A",       bg:NA_BG,   tx:NA_TX   },
  };
  return map[estado] || map.na;
}

async function generarWord(visita){
  if(!window.docx){ toast("No se ha podido cargar el generador de Word."); return; }
  toast("Generando documento Word…");
  const {
    Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
    WidthType, ShadingType, BorderStyle, AlignmentType, HeadingLevel,
    VerticalAlign, Header, Footer, PageNumber, ImageRun, TabStopType,
  } = window.docx;

  function run(text, opts={}) { return new TextRun({ text, ...opts }); }
  function tit(text, opts={}) {
    return new Paragraph({ text, heading: opts.heading, spacing:{before:opts.before||0, after:opts.after||120} });
  }
  function cell(children, opts={}) {
    return new TableCell({
      children: Array.isArray(children) ? children : [children],
      width: { size: opts.width||1000, type: WidthType.DXA },
      shading: opts.bg ? { type: ShadingType.CLEAR, fill: opts.bg } : undefined,
      verticalAlign: VerticalAlign.CENTER,
      margins: { top:70, bottom:70, left:90, right:90 },
      borders: opts.borders,
    });
  }
  const thinBorder = { style: BorderStyle.SINGLE, size: 2, color: LINE };
  const cellBorders = { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder };
  const noBorderSet = {top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE}};

  function metaTable(){
    const rows = [
      ["N.º de visita", String(visita.nVisita).padStart(2,"0"), "Fecha", fmtFechaEs(visita.fecha)],
      ["Técnico / DAO", visita.tecnico, "Entidad", CONFIG.ENTIDAD],
    ];
    return new Table({
      width: { size: 9026, type: WidthType.DXA },
      columnWidths: [1500, 2900, 1500, 3126],
      rows: rows.map(([l1,v1,l2,v2]) => new TableRow({ children: [
        cell(new Paragraph({ children:[run(l1,{bold:true,size:S9,color:INK_MUTED})] }), {width:1500, bg:HEAD_BG, borders:cellBorders}),
        cell(new Paragraph({ children:[run(v1,{size:S10_5})] }), {width:2900, borders:cellBorders}),
        cell(new Paragraph({ children:[run(l2,{bold:true,size:S9,color:INK_MUTED})] }), {width:1500, bg:HEAD_BG, borders:cellBorders}),
        cell(new Paragraph({ children:[run(v2,{size:S10_5})] }), {width:3126, borders:cellBorders}),
      ]})),
    });
  }

  function fasePillTable(){
    const opts = [ {key:"previa", label:"Fase previa a construcción"}, {key:"construccion", label:"Fase de construcción"} ];
    return new Table({
      width:{size:9026,type:WidthType.DXA}, columnWidths:[4513,4513],
      rows:[ new TableRow({ children: opts.map(o => {
        const on = visita.fase === o.key;
        return cell(new Paragraph({
          alignment: AlignmentType.CENTER,
          children:[ run((on?"● ":"○ ") + o.label, {bold:on, size:S9, color: on ? "FFFFFF" : INK_MUTED}) ],
        }), {width:4513, bg: on ? VERDE_OSC : HEAD_BG, borders:cellBorders});
      })})],
    });
  }

  function resumenApartadosTable(){
    const header = new TableRow({
      tableHeader: true,
      children: [
        cell(new Paragraph({children:[run("Apartado PVA", {bold:true,size:S9,color:"FFFFFF"})]}), {width:6300, bg:VERDE_OSC, borders:cellBorders}),
        cell(new Paragraph({children:[run("En esta visita", {bold:true,size:S9,color:"FFFFFF"})], alignment:AlignmentType.CENTER}), {width:2726, bg:VERDE_OSC, borders:cellBorders}),
      ],
    });
    const rows = visita.temas.map(t => new TableRow({ children: [
      cell(new Paragraph({children:[run(`${t.num}. ${t.nombre}`, {size:S10, bold:t.aplica})]}), {width:6300, bg: t.aplica ? "FFFFFF" : HEAD_BG, borders:cellBorders}),
      cell(new Paragraph({
        children:[run(t.aplica ? "APLICA" : "No aplica", {bold:t.aplica, size:S9, color: t.aplica ? VERDE_OSC : INK_MUTED})],
        alignment:AlignmentType.CENTER,
      }), {width:2726, bg: t.aplica ? GOOD_BG : HEAD_BG, borders:cellBorders}),
    ]}));
    return new Table({ width:{size:9026,type:WidthType.DXA}, columnWidths:[6300,2726], rows:[header, ...rows] });
  }

  function temaSection(t){
    const items = itemsForFaseDoc(visita.detalle[t.num] || [], visita.fase);
    const barra = new Paragraph({
      shading: { type: ShadingType.CLEAR, fill: VERDE },
      spacing: { before: 260, after: 120 },
      children: [ run(`  ${t.num}.  ${t.nombre.toUpperCase()}`, { bold:true, size:S12, color:"FFFFFF" }) ],
    });
    const header = new TableRow({
      tableHeader: true,
      children: [
        cell(new Paragraph({children:[run("Cód.",{bold:true,size:S9,color:INK_MUTED})]}), {width:700, bg:HEAD_BG, borders:cellBorders}),
        cell(new Paragraph({children:[run("Medida de seguimiento",{bold:true,size:S9,color:INK_MUTED})]}), {width:3900, bg:HEAD_BG, borders:cellBorders}),
        cell(new Paragraph({children:[run("Estado",{bold:true,size:S9,color:INK_MUTED})], alignment:AlignmentType.CENTER}), {width:1400, bg:HEAD_BG, borders:cellBorders}),
        cell(new Paragraph({children:[run("Observaciones de la visita",{bold:true,size:S9,color:INK_MUTED})]}), {width:3026, bg:HEAD_BG, borders:cellBorders}),
      ],
    });
    const rows = items.map(it => {
      const b = estadoBadge(it.estado);
      const obsParas = [ new Paragraph({children:[run(it.obs||"",{size:S9})]}) ];
      if(it.correctora){
        obsParas.push(new Paragraph({ spacing:{before:40}, children:[
          run("Medida correctora: ", {bold:true, italics:true, size:S9, color:BAD_TX}),
          run(it.correctora, {italics:true, size:S9, color:BAD_TX}),
        ]}));
      }
      return new TableRow({ children: [
        cell(new Paragraph({children:[run(it.codigo,{bold:true,size:S9,color:VERDE_OSC})]}), {width:700, borders:cellBorders}),
        cell(new Paragraph({children:[run(it.resumen,{size:S9})]}), {width:3900, borders:cellBorders}),
        cell(new Paragraph({children:[run(b.label,{bold:true,size:S9,color:b.tx})], alignment:AlignmentType.CENTER}), {width:1400, bg:b.bg, borders:cellBorders}),
        cell(obsParas, {width:3026, borders:cellBorders}),
      ]});
    });
    const table = new Table({ width:{size:9026,type:WidthType.DXA}, columnWidths:[700,3900,1400,3026], rows:[header, ...rows] });
    return [barra, table];
  }

  const ok = visita.temas.filter(t=>t.aplica);
  const allItems = ok.flatMap(t => itemsForFaseDoc(visita.detalle[t.num] || [], visita.fase));
  const nCumple = allItems.filter(i=>i.estado==='cumple').length;
  const nNoCumple = allItems.filter(i=>i.estado==='no_cumple').length;
  const nNA = allItems.filter(i=>i.estado==='na').length;

  const children = [];

  const promotorCell = cell([
    new Paragraph({ children:[ run("PROMOTOR", {size:S9-2, color:INK_MUTED, bold:true, characterSpacing:14}) ] }),
    new Paragraph({ spacing:{before:60,after:60}, children: [
      new ImageRun({ data: b64ToUint8(LOGO_ENGIE_B64), transformation:{width:ENGIE_PX.w,height:ENGIE_PX.h}, type:"jpg" }),
    ]}),
    new Paragraph({ children:[ run(CONFIG.PROMOTOR, {bold:true, size:S9, color:INK}) ] }),
  ], {width:4513, borders:noBorderSet});

  const artesaCell = cell([
    new Paragraph({ alignment: AlignmentType.RIGHT, children: [
      new ImageRun({ data: b64ToUint8(LOGO_ARTESA_B64), transformation:{width:ARTESA_PX.w,height:ARTESA_PX.h}, type:"jpg" }),
    ]}),
  ], {width:4513, borders:noBorderSet});

  children.push(new Table({
    width:{size:9026,type:WidthType.DXA}, columnWidths:[4513,4513],
    rows:[ new TableRow({ cantSplit:true, children:[ promotorCell, artesaCell ] }) ],
  }));

  children.push(new Paragraph({
    spacing:{before:240, after:60},
    children:[ run("Acta de visita de seguimiento ambiental", {bold:true, size:S20, color:INK}) ],
  }));
  children.push(new Paragraph({
    spacing:{after:60},
    children:[ run("PLAN DE VIGILANCIA AMBIENTAL — FASE DE OBRA", {bold:true, size:S10, color:VERDE_OSC, characterSpacing: 12}) ],
  }));
  children.push(new Paragraph({
    border:{ bottom:{ style:BorderStyle.SINGLE, size:14, color:VERDE } },
    spacing:{after:200},
    children:[ run(CONFIG.PROYECTO, {size:S11, color:INK_MUTED}) ],
  }));

  children.push(metaTable());
  children.push(fasePillTable());
  children.push(new Paragraph({ spacing:{before:140,after:200}, children:[
    run("Condiciones de la visita: ", {bold:true, size:S9, color:INK_MUTED}),
    run(visita.condiciones||"", {size:S9, color:INK_MUTED}),
  ]}));

  const statCell = (n, tx) => cell(new Paragraph({
      alignment: AlignmentType.CENTER,
      children:[ run(String(n), {bold:true, size:S11, color:tx}) ],
    }), {width:2256, borders:noBorderSet});
  const statLabelCell = (label, tx) => cell(new Paragraph({
      alignment: AlignmentType.CENTER,
      children:[ run(label, {size:S9, color:tx}) ],
    }), {width:2256, borders:noBorderSet});

  children.push(new Table({
    width:{size:9026, type:WidthType.DXA}, columnWidths:[2256,2257,2257,2256],
    rows:[
      new TableRow({children:[ statCell(ok.length, INK), statCell(nCumple, GOOD_TX), statCell(nNoCumple, BAD_TX), statCell(nNA, NA_TX) ]}),
      new TableRow({children:[
        statLabelCell("apartados revisados", INK_MUTED),
        statLabelCell("medidas cumplen", GOOD_TX),
        statLabelCell("no conformidades", BAD_TX),
        statLabelCell("no aplican", NA_TX),
      ]}),
    ],
  }));

  children.push(tit("Apartados del Plan de Vigilancia Ambiental", {heading:HeadingLevel.HEADING_3, before:280, after:100}));
  children.push(resumenApartadosTable());

  for(const t of ok) children.push(...temaSection(t));

  children.push(tit("Observaciones generales de la visita", {heading:HeadingLevel.HEADING_3, before:320, after:100}));
  children.push(new Paragraph({
    border:{ left:{style:BorderStyle.SINGLE,size:18,color:VERDE} },
    indent:{left:200},
    children:[ run(visita.obsGenerales||"—", {size:S10_5}) ],
  }));

  const noBorder = {style:BorderStyle.NONE};
  const sigCell = (label, name) => cell([
    new Paragraph({ spacing:{before:560, after:60}, border:{top:{style:BorderStyle.SINGLE,size:4,color:LINE}}, children:[run(name||"", {bold:!!name, size:S10_5})] }),
    new Paragraph({ children:[run(label,{size:S9,color:INK_MUTED})] }),
  ], {width:4513, borders:{top:noBorder,bottom:noBorder,left:noBorder,right:noBorder}});

  children.push(new Paragraph({ spacing:{before:420}, children:[run("")] }));
  children.push(new Table({
    width:{size:9026,type:WidthType.DXA}, columnWidths:[4513,4513],
    rows:[ new TableRow({children:[
      sigCell("Técnico DAO", visita.firmaTecnico || visita.tecnico),
      sigCell("Representante contratista", visita.firmaContratista),
    ]})],
  }));

  const doc = new Document({
    styles: { default: { document: { run: { font: "Arial" } } } },
    sections: [{
      properties: { page: { margin: { top:1000, bottom:1000, left:1417, right:1417 } } },
      headers: { default: new Header({ children: [ new Paragraph({
        alignment: AlignmentType.RIGHT,
        children:[ run(CONFIG.ENCABEZADO_DOC, {size:S9, color:INK_MUTED}) ],
        border:{ bottom:{style:BorderStyle.SINGLE,size:4,color:LINE} },
      })]})},
      footers: { default: new Footer({ children: [ new Paragraph({
        border:{ top:{style:BorderStyle.SINGLE,size:4,color:LINE} },
        spacing:{before:120},
        tabStops:[{ type: TabStopType.RIGHT, position: 9072 }],
        children:[
          run(CONFIG.PIE_DOC, {size:S9-2, color:INK_MUTED}),
          new TextRun({ text:"\tPágina ", size:S9-2, color:INK_MUTED }),
          new TextRun({ children:[PageNumber.CURRENT], size:S9-2, color:INK_MUTED }),
          new TextRun({ text:" de ", size:S9-2, color:INK_MUTED }),
          new TextRun({ children:[PageNumber.TOTAL_PAGES], size:S9-2, color:INK_MUTED }),
        ],
      })]})},
      children,
    }],
  });

  try{
    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = (visita.fecha||"").replace(/-/g,"");
    a.href = url;
    a.download = `Acta_visita_${String(visita.nVisita).padStart(2,"0")}_${fecha}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast("Documento Word generado.");
  }catch(e){
    console.error(e);
    toast("Ha ocurrido un error generando el Word.");
  }
}

</script>
<script>
/* =========================================================================
   Autenticación con Google (Identity Services) y sincronización con
   Google Sheets (hoja de consolidación) y Google Drive (fotos).
   ========================================================================= */

let tokenClient = null;
let cachedSheetName = null;

function initGoogleClient(){
  if(tokenClient) return;
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    throw new Error("google-identity-not-loaded");
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: "openid email profile " + CONFIG.SCOPES,
    callback: () => {},
  });
}

function googleSignIn(){
  return new Promise((resolve) => {
    if(CONFIG.GOOGLE_CLIENT_ID.indexOf("PEGA_AQUI") === 0){
      toast("Falta configurar el Client ID de Google en la app (ver CONFIG en el código).");
      resolve();
      return;
    }
    try{ initGoogleClient(); }
    catch(e){
      toast("No se ha podido cargar el inicio de sesión de Google. Comprueba tu conexión e inténtalo de nuevo.");
      resolve();
      return;
    }
    tokenClient.callback = async (resp) => {
      if(resp.error){
        toast("No se ha podido iniciar sesión con Google.");
        resolve();
        return;
      }
      STATE.accessToken = resp.access_token;
      STATE.tokenExpiry = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
      try{
        const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers:{ Authorization:"Bearer "+STATE.accessToken } });
        const info = await r.json();
        STATE.user = { name: info.name||"", email: info.email||"", picture: info.picture||"" };
      }catch(e){
        STATE.user = { name:"", email:"", picture:"" };
      }
      loadVisitas();
      goto("home");
      resolve();
    };
    tokenClient.requestAccessToken({ prompt: STATE.user ? "" : "consent" });
  });
}

function ensureAccessToken(){
  return new Promise((resolve, reject) => {
    if(STATE.accessToken && Date.now() < STATE.tokenExpiry){ resolve(STATE.accessToken); return; }
    try{ initGoogleClient(); }catch(e){ reject(e); return; }
    tokenClient.callback = (resp) => {
      if(resp.error){ reject(new Error(resp.error)); return; }
      STATE.accessToken = resp.access_token;
      STATE.tokenExpiry = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
      resolve(STATE.accessToken);
    };
    tokenClient.requestAccessToken({ prompt: "" });
  });
}

async function getFirstSheetName(token){
  if(cachedSheetName) return cachedSheetName;
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}?fields=sheets.properties.title`, {
    headers: { Authorization: "Bearer "+token },
  });
  if(!res.ok) throw new Error("sheet-meta-failed-"+res.status);
  const data = await res.json();
  cachedSheetName = data.sheets && data.sheets[0] && data.sheets[0].properties.title;
  if(!cachedSheetName) throw new Error("sheet-name-not-found");
  return cachedSheetName;
}

async function uploadPhotoToDrive(token, dataUrl, filename){
  const base64Data = dataUrl.split(",")[1];
  const metadata = { name: filename, parents: [CONFIG.DRIVE_FOLDER_ID], mimeType: "image/jpeg" };
  const boundary = "artesa_dao_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64Data}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST",
    headers: { Authorization: "Bearer "+token, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if(!res.ok) throw new Error("drive-upload-failed-"+res.status);
  return res.json();
}

async function appendRowsToSheet(token, rows){
  if(!rows.length) return;
  const sheetName = await getFirstSheetName(token);
  const range = encodeURIComponent(sheetName + "!A:R");
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${range}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: "POST",
    headers: { Authorization: "Bearer "+token, "Content-Type": "application/json" },
    body: JSON.stringify({ values: rows }),
  });
  if(!res.ok) throw new Error("sheets-append-failed-"+res.status);
  return res.json();
}

async function syncVisita(visita){
  if(STATE.syncing) return;
  STATE.syncing = true;
  toast("Sincronizando ficha…");
  try{
    const token = await ensureAccessToken();
    const rows = [];
    const faseLabel = visita.fase === "previa" ? "Previa a construcción" : "Construcción";
    for(const num of temasAplicables(visita)){
      const temaData = TEMAS_DATA.find(t => t.num === num);
      const items = visita.detalle[num] || [];
      for(const it of items){
        const fotoUrls = [], fotoNames = [];
        for(const foto of (it.fotos || [])){
          try{
            const uploaded = await uploadPhotoToDrive(token, foto.dataUrl, foto.name);
            fotoUrls.push(uploaded.webViewLink || ("https://drive.google.com/file/d/"+uploaded.id+"/view"));
            fotoNames.push(foto.name);
          }catch(e){ console.error("foto upload failed", e); }
        }
        rows.push([
          visita.nVisita, fmtFechaEs(visita.fecha), faseLabel,
          visita.tecnico, CONFIG.ENTIDAD, visita.condiciones,
          num, temaData.nombre, it.codigo, it.resumen, it.tipo,
          it.estado === "cumple" ? "CUMPLE" : it.estado === "no_cumple" ? "NO CUMPLE" : "N/A",
          it.obs, it.correctora, fotoUrls.join(" | "), fotoNames.join(" | "),
          new Date().toISOString(), visita.obsGenerales,
        ]);
      }
    }
    await appendRowsToSheet(token, rows);
    visita.syncStatus = "synced";
    persistCurrent();
    toast("Ficha sincronizada correctamente.");
    goto("home");
  }catch(e){
    console.error(e);
    visita.syncStatus = "error";
    persistCurrent();
    toast("No se ha podido sincronizar (revisa la conexión). La ficha queda guardada como borrador.");
  }finally{
    STATE.syncing = false;
  }
}

</script>
<script>
/* =========================================================================
   DAO FV Alentisque — App de seguimiento ambiental en fase de construcción
   Una visita = una ficha. Los apartados aplicables se eligen por visita y
   se filtran según la fase (previa a construcción / construcción).
   ========================================================================= */

const LS_KEY = "dao_alentisque_visitas_v1";
const LS_PROFILE = "dao_alentisque_perfil_v1";

const STATE = {
  view: "login",
  user: null,          // {name, email, picture}
  accessToken: null,   // Google OAuth access token (memoria, no se persiste)
  tokenExpiry: 0,
  visitas: [],
  current: null,       // visita en edición
  temaFlowOrder: [],   // números de tema aplicables, en orden, para el flujo de checklist
  temaFlowIdx: 0,
  expanded: {},         // codigo -> bool (expandido en checklist)
  syncing: false,
};

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = document.getElementById("app");

function uid(){ return "v_" + Date.now() + "_" + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtFechaEs(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------------------------------------------------------------- */
/* Persistencia local                                                      */
/* ---------------------------------------------------------------------- */
function loadVisitas(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    STATE.visitas = raw ? JSON.parse(raw) : [];
  }catch(e){ STATE.visitas = []; }
}
function saveVisitas(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(STATE.visitas));
  }catch(e){
    toast("No se ha podido guardar en este dispositivo (memoria llena). Sincroniza cuanto antes para no perder datos.");
  }
}
function loadProfile(){
  try{ return JSON.parse(localStorage.getItem(LS_PROFILE) || "{}"); }catch(e){ return {}; }
}
function saveProfile(p){
  try{ localStorage.setItem(LS_PROFILE, JSON.stringify(p)); }catch(e){}
}
function persistCurrent(){
  if(!STATE.current) return;
  STATE.current.updatedAt = Date.now();
  const idx = STATE.visitas.findIndex(v => v.id === STATE.current.id);
  if(idx >= 0) STATE.visitas[idx] = STATE.current;
  else STATE.visitas.unshift(STATE.current);
  saveVisitas();
}

/* ---------------------------------------------------------------------- */
/* Modelo de visita                                                        */
/* ---------------------------------------------------------------------- */
function nextNVisita(){
  const nums = STATE.visitas.map(v => Number(v.nVisita)||0);
  return (nums.length ? Math.max(...nums) : 0) + 1;
}

function newVisita(){
  const profile = loadProfile();
  return {
    id: uid(),
    nVisita: nextNVisita(),
    fecha: todayISO(),
    fase: "construccion",
    tecnico: profile.tecnico || "",
    condiciones: "",
    temas: TEMAS_DATA.map(t => ({ num:t.num, nombre:t.nombre, aplica:false })),
    detalle: {},
    obsGenerales: "",
    firmaTecnico: "",
    firmaContratista: "",
    syncStatus: "draft",
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
}

function itemsForFase(items, fase){
  return items.filter(it => it.fase === "ambas" || it.fase === fase);
}

// Construye / sincroniza el detalle de un tema con la fase actual, conservando
// las respuestas ya dadas a códigos que sigan aplicando.
function ensureDetalle(visita, num){
  const temaData = TEMAS_DATA.find(t => t.num === num);
  if(!temaData) return [];
  const wanted = itemsForFase(temaData.items, visita.fase);
  const prev = visita.detalle[num] || [];
  const prevByCod = Object.fromEntries(prev.map(it => [it.codigo, it]));
  visita.detalle[num] = wanted.map(w => {
    const old = prevByCod[w.codigo];
    return old ? old : {
      codigo:w.codigo, resumen:w.resumen, texto:w.texto, tipo:w.tipo,
      frecuencia:w.frecuencia, origen:w.origen, fase:w.fase,
      estado:"pendiente", obs:"", correctora:"", fotos:[],
    };
  });
  return visita.detalle[num];
}

function temasAplicables(visita){
  return visita.temas.filter(t => t.aplica).map(t => t.num);
}

function countCountsForVisita(visita){
  const nums = temasAplicables(visita);
  let cumple=0,no_cumple=0,na=0,pendiente=0,total=0;
  nums.forEach(num => {
    const items = visita.detalle[num] || [];
    items.forEach(it => {
      total++;
      if(it.estado==="cumple") cumple++;
      else if(it.estado==="no_cumple") no_cumple++;
      else if(it.estado==="na") na++;
      else pendiente++;
    });
  });
  return {cumple,no_cumple,na,pendiente,total,apartados:nums.length};
}

/* ---------------------------------------------------------------------- */
/* Render — router simple                                                  */
/* ---------------------------------------------------------------------- */
function render(){
  window.scrollTo(0,0);
  if(STATE.view === "login") return renderLogin();
  if(STATE.view === "home") return renderHome();
  if(STATE.view === "datos") return renderDatos();
  if(STATE.view === "apartados") return renderApartados();
  if(STATE.view === "checklist") return renderChecklist();
  if(STATE.view === "revision") return renderRevision();
  if(STATE.view === "settings") return renderSettings();
}

function goto(view){ STATE.view = view; render(); }

/* ---------------------------------------------------------------------- */
/* Vista: Login                                                            */
/* ---------------------------------------------------------------------- */
function renderLogin(){
  el.innerHTML = `
    <div class="login-wrap">
      <img class="logo" src="data:image/jpeg;base64,${LOGO_ARTESA_B64}" alt="ARTESA">
      <h2>Seguimiento ambiental DAO</h2>
      <p>${escapeHtml(CONFIG.PROYECTO)}<br><span class="muted">Fichas de visita del Plan de Vigilancia Ambiental — fase de obra.</span></p>
      <button class="btn btn-primary" id="btn-login" style="max-width:260px;">Continuar con Google</button>
      <p class="small" style="margin-top:22px;max-width:280px;">Inicia sesión con la cuenta de Google del equipo para poder sincronizar las fichas con la hoja de cálculo y la carpeta compartidas.</p>
      <button class="btn btn-secondary" id="btn-offline" style="max-width:260px;margin-top:8px;">Usar sin conectar (solo en este móvil)</button>
    </div>`;
  $("#btn-login").addEventListener("click", googleSignIn);
  $("#btn-offline").addEventListener("click", () => {
    STATE.user = null;
    loadVisitas();
    goto("home");
  });
}

/* ---------------------------------------------------------------------- */
/* Vista: Home                                                             */
/* ---------------------------------------------------------------------- */
function renderHome(){
  const rows = STATE.visitas.slice().sort((a,b)=>b.createdAt-a.createdAt);
  el.innerHTML = `
    <div class="brandbar">
      <img src="data:image/jpeg;base64,${LOGO_ARTESA_B64}" alt="ARTESA">
      <button class="pill-btn" id="btn-settings">⚙ Ajustes</button>
    </div>
    <div class="container" style="padding-top:4px;">
      <div class="section-title" style="margin-top:2px;">Visitas de seguimiento</div>
      <div id="lista-visitas">
        ${rows.length ? rows.map(v => visitaRowHtml(v)).join("") : emptyStateHtml()}
      </div>
    </div>
    <div class="fab"><button id="btn-nueva">+</button></div>
  `;
  $("#btn-settings").addEventListener("click", () => goto("settings"));
  $("#btn-nueva").addEventListener("click", () => {
    STATE.current = newVisita();
    goto("datos");
  });
  $$(".visita-item").forEach(node => {
    node.addEventListener("click", () => {
      const v = STATE.visitas.find(x => x.id === node.dataset.id);
      if(!v) return;
      STATE.current = v;
      goto("datos");
    });
  });
}

function emptyStateHtml(){
  return `<div class="empty-state">
    <div>📋</div>
    <p>Todavía no hay visitas registradas.<br>Pulsa el botón + para crear la primera ficha.</p>
  </div>`;
}

function visitaRowHtml(v){
  const c = countCountsForVisita(v);
  const badge = v.syncStatus === "synced" ? '<span class="badge badge-synced">SINCRONIZADA</span>'
    : v.syncStatus === "error" ? '<span class="badge badge-error">ERROR SYNC</span>'
    : '<span class="badge badge-draft">BORRADOR</span>';
  const faseLabel = v.fase === "previa" ? "Fase previa a construcción" : "Fase de construcción";
  return `<div class="visita-item" data-id="${v.id}">
    <div class="visita-num">${String(v.nVisita).padStart(2,"0")}</div>
    <div class="visita-info">
      <div class="t1">${fmtFechaEs(v.fecha)} · ${escapeHtml(faseLabel)}</div>
      <div class="t2">${c.apartados} apartados · ${c.cumple} cumplen · ${c.no_cumple} no conformidades ${c.pendiente ? "· "+c.pendiente+" pendientes" : ""}</div>
      <div style="margin-top:6px;">${badge}</div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------- */
/* Vista: Datos generales + fase                                           */
/* ---------------------------------------------------------------------- */
function renderDatos(){
  const v = STATE.current;
  el.innerHTML = `
    <div class="topbar">
      <button class="back" id="btn-back">←</button>
      <h1>Nueva visita · ficha n.º ${String(v.nVisita).padStart(2,"0")}<span class="sub">${escapeHtml(CONFIG.PROYECTO)}</span></h1>
    </div>
    <div class="container">
      <div class="card">
        <div class="field">
          <label class="field-label">Fecha de la visita</label>
          <input type="date" id="f-fecha" value="${v.fecha}">
        </div>
        <div class="field">
          <label class="field-label">Técnico DAO</label>
          <input type="text" id="f-tecnico" value="${escapeHtml(v.tecnico)}" placeholder="Nombre y apellidos">
        </div>
        <div class="field">
          <label class="field-label">Condiciones de la visita</label>
          <textarea id="f-condiciones" placeholder="Meteorología, estado de la obra, trabajos en ejecución…">${escapeHtml(v.condiciones)}</textarea>
        </div>
        <div class="field" style="margin-bottom:4px;">
          <label class="field-label">Fase del PVA a revisar</label>
          <div class="fase-pills">
            <div class="fase-pill ${v.fase==='previa'?'on':''}" data-fase="previa">Previa a construcción</div>
            <div class="fase-pill ${v.fase==='construccion'?'on':''}" data-fase="construccion">Construcción</div>
          </div>
          <div class="small muted">Solo se mostrarán las medidas del PVA que corresponden a esta fase.</div>
        </div>
      </div>
    </div>
    <div class="bottombar">
      <button class="btn btn-primary" id="btn-continuar">Continuar →</button>
    </div>
  `;
  $("#btn-back").addEventListener("click", () => { persistCurrent(); goto("home"); });
  $("#f-fecha").addEventListener("input", e => v.fecha = e.target.value);
  $("#f-tecnico").addEventListener("input", e => { v.tecnico = e.target.value; });
  $("#f-condiciones").addEventListener("input", e => v.condiciones = e.target.value);
  $$(".fase-pill").forEach(p => p.addEventListener("click", () => {
    v.fase = p.dataset.fase;
    $$(".fase-pill").forEach(x=>x.classList.toggle("on", x.dataset.fase===v.fase));
  }));
  $("#btn-continuar").addEventListener("click", () => {
    if(!v.tecnico.trim()){ toast("Indica el nombre del técnico DAO."); return; }
    const profile = loadProfile(); profile.tecnico = v.tecnico.trim(); saveProfile(profile);
    persistCurrent();
    goto("apartados");
  });
}

/* ---------------------------------------------------------------------- */
/* Vista: Apartados aplicables                                             */
/* ---------------------------------------------------------------------- */
function renderApartados(){
  const v = STATE.current;
  const faseLabel = v.fase === "previa" ? "fase previa a construcción" : "fase de construcción";
  el.innerHTML = `
    <div class="topbar">
      <button class="back" id="btn-back">←</button>
      <h1>Apartados de esta visita<span class="sub">Marca los que aplican en ${escapeHtml(faseLabel)}</span></h1>
    </div>
    <div class="container">
      <div id="temas-list">
        ${TEMAS_DATA.map(t => {
          const n = itemsForFase(t.items, v.fase).length;
          const vt = v.temas.find(x=>x.num===t.num);
          return `<div class="tema-row">
            <div class="txt">
              <div class="n">${t.num}. ${escapeHtml(t.nombre)}</div>
              <div class="c">${n} medida${n===1?"":"s"} del PVA en esta fase${n===0?" (sin medidas — solo observación general)":""}</div>
            </div>
            <label class="switch">
              <input type="checkbox" data-num="${t.num}" ${vt.aplica?"checked":""}>
              <span class="slider"></span>
            </label>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="bottombar">
      <button class="btn btn-primary" id="btn-continuar">Rellenar fichas →</button>
    </div>
  `;
  $("#btn-back").addEventListener("click", () => { persistCurrent(); goto("datos"); });
  $$("#temas-list input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      const num = Number(cb.dataset.num);
      const vt = v.temas.find(x=>x.num===num);
      vt.aplica = cb.checked;
      if(cb.checked) ensureDetalle(v, num);
    });
  });
  $("#btn-continuar").addEventListener("click", () => {
    const nums = temasAplicables(v);
    if(!nums.length){ toast("Marca al menos un apartado que aplique en esta visita."); return; }
    nums.forEach(n => ensureDetalle(v, n));
    STATE.temaFlowOrder = nums;
    STATE.temaFlowIdx = 0;
    persistCurrent();
    goto("checklist");
  });
}

/* ---------------------------------------------------------------------- */
/* Vista: Checklist por tema                                               */
/* ---------------------------------------------------------------------- */
function renderChecklist(){
  const v = STATE.current;
  const num = STATE.temaFlowOrder[STATE.temaFlowIdx];
  const temaData = TEMAS_DATA.find(t=>t.num===num);
  const items = v.detalle[num] || [];
  const isLast = STATE.temaFlowIdx === STATE.temaFlowOrder.length - 1;

  el.innerHTML = `
    <div class="topbar">
      <button class="back" id="btn-back">←</button>
      <h1>${num}. ${escapeHtml(temaData.nombre)}<span class="sub">Tema ${STATE.temaFlowIdx+1} de ${STATE.temaFlowOrder.length} aplicables</span></h1>
    </div>
    <div class="progress-dots">
      ${STATE.temaFlowOrder.map((n,i)=>`<span class="${i===STATE.temaFlowIdx?'on':''}"></span>`).join("")}
    </div>
    <div class="container">
      ${items.length ? items.map(it => itemRowHtml(it)).join("") : `<div class="card muted center">Este apartado no tiene medidas específicas del PVA en esta fase. Puedes anotar cualquier incidencia en las observaciones generales al final de la ficha.</div>`}
    </div>
    <div class="bottombar">
      ${STATE.temaFlowIdx>0 ? `<button class="btn btn-secondary" id="btn-prev">← Anterior</button>` : `<button class="btn btn-secondary" id="btn-prev">Apartados</button>`}
      <button class="btn btn-primary" id="btn-next">${isLast ? "Revisión final →" : "Siguiente tema →"}</button>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
  `;

  $("#btn-back").addEventListener("click", () => { persistCurrent(); goto("apartados"); });
  $("#btn-prev").addEventListener("click", () => {
    persistCurrent();
    if(STATE.temaFlowIdx>0){ STATE.temaFlowIdx--; goto("checklist"); }
    else goto("apartados");
  });
  $("#btn-next").addEventListener("click", () => {
    persistCurrent();
    if(isLast){ goto("revision"); }
    else { STATE.temaFlowIdx++; goto("checklist"); }
  });

  wireItemRows(v, num);
}

function itemRowHtml(it){
  const expanded = !!STATE.expanded[it.codigo];
  return `<div class="item-row st-${it.estado}" data-cod="${it.codigo}">
    <div class="item-head" data-toggle="${it.codigo}">
      <div class="cod">${it.codigo}</div>
      <div class="res">${escapeHtml(it.resumen)}</div>
      <div class="chev">${expanded ? "▲" : "▼"}</div>
    </div>
    <div class="item-body ${expanded?"":"hidden"}">
      <div class="full-text">${escapeHtml(it.texto)}</div>
      <div class="item-meta">${it.tipo} · ${escapeHtml(it.frecuencia)} · origen: ${it.origen}</div>
      <div class="seg" data-seg="${it.codigo}">
        <button data-v="cumple" class="${it.estado==='cumple'?'sel-cumple':''}">CUMPLE</button>
        <button data-v="no_cumple" class="${it.estado==='no_cumple'?'sel-no_cumple':''}">NO CUMPLE</button>
        <button data-v="na" class="${it.estado==='na'?'sel-na':''}">N/A</button>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label class="field-label">Observación</label>
        <textarea data-obs="${it.codigo}" placeholder="Descripción de lo observado en campo…">${escapeHtml(it.obs)}</textarea>
      </div>
      <div class="field correctora-field ${it.estado==='no_cumple'?"":"hidden"}" style="margin-bottom:8px;">
        <label class="field-label" style="color:var(--bad-tx);">Medida correctora</label>
        <textarea data-correctora="${it.codigo}" placeholder="Acción correctora propuesta y plazo…">${escapeHtml(it.correctora)}</textarea>
      </div>
      <label class="field-label">Fotografías</label>
      <div class="photos-row" data-fotos="${it.codigo}">
        ${(it.fotos||[]).map((f,i)=>`<div class="photo-thumb"><img src="${f.dataUrl}"><button class="rm" data-rmfoto="${it.codigo}" data-idx="${i}">✕</button></div>`).join("")}
        <button class="add-photo-btn" data-addfoto="${it.codigo}">＋</button>
      </div>
    </div>
  </div>`;
}

function wireItemRows(visita, num){
  const items = visita.detalle[num] || [];
  const byId = Object.fromEntries(items.map(it=>[it.codigo,it]));
  const photoInput = $("#photo-input");
  let targetCodigo = null;

  $$("[data-toggle]").forEach(h => h.addEventListener("click", () => {
    const cod = h.dataset.toggle;
    STATE.expanded[cod] = !STATE.expanded[cod];
    renderChecklist();
  }));

  $$("[data-seg] button").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const cod = b.closest("[data-seg]").dataset.seg;
    byId[cod].estado = b.dataset.v;
    STATE.expanded[cod] = true;
    renderChecklist();
  }));

  $$("[data-obs]").forEach(t => t.addEventListener("input", () => { byId[t.dataset.obs].obs = t.value; }));
  $$("[data-correctora]").forEach(t => t.addEventListener("input", () => { byId[t.dataset.correctora].correctora = t.value; }));

  $$("[data-addfoto]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    targetCodigo = b.dataset.addfoto;
    photoInput.value = "";
    photoInput.click();
  }));
  $$("[data-rmfoto]").forEach(b => b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const cod = b.dataset.rmfoto, idx = Number(b.dataset.idx);
    byId[cod].fotos.splice(idx,1);
    renderChecklist();
  }));

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files && photoInput.files[0];
    if(!file || !targetCodigo) return;
    try{
      const dataUrl = await resizeImageFile(file, CONFIG.FOTO_MAX_LADO, CONFIG.FOTO_CALIDAD);
      byId[targetCodigo].fotos = byId[targetCodigo].fotos || [];
      byId[targetCodigo].fotos.push({ dataUrl, name: `foto_${targetCodigo}_${Date.now()}.jpg` });
      STATE.expanded[targetCodigo] = true;
      renderChecklist();
    }catch(e){ toast("No se ha podido procesar la foto."); }
  });
}

function resizeImageFile(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxSide){ height = Math.round(height * maxSide/width); width = maxSide; }
        else if(height > maxSide){ width = Math.round(width * maxSide/height); height = maxSide; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------- */
/* Vista: Revisión final                                                   */
/* ---------------------------------------------------------------------- */
function pendingIssues(visita){
  const issues = [];
  temasAplicables(visita).forEach(num => {
    (visita.detalle[num]||[]).forEach(it => {
      if(it.estado === "pendiente") issues.push(`${it.codigo} — falta marcar Cumple / No cumple / N-A`);
      if(it.estado === "no_cumple" && !it.correctora.trim()) issues.push(`${it.codigo} — falta la medida correctora`);
    });
  });
  return issues;
}

function renderRevision(){
  const v = STATE.current;
  const c = countCountsForVisita(v);
  const issues = pendingIssues(v);
  el.innerHTML = `
    <div class="topbar">
      <button class="back" id="btn-back">←</button>
      <h1>Revisión final<span class="sub">Ficha n.º ${String(v.nVisita).padStart(2,"0")} · ${fmtFechaEs(v.fecha)}</span></h1>
    </div>
    <div class="container">
      <div class="stats-row">
        <div class="s"><div class="n">${c.apartados}</div><div class="l">apartados</div></div>
        <div class="s"><div class="n" style="color:var(--good-tx)">${c.cumple}</div><div class="l">cumplen</div></div>
        <div class="s"><div class="n" style="color:var(--bad-tx)">${c.no_cumple}</div><div class="l">no conformidades</div></div>
        <div class="s"><div class="n" style="color:var(--na-tx)">${c.na}</div><div class="l">no aplican</div></div>
      </div>

      ${issues.length ? `<div class="alert-box"><strong>Faltan ${issues.length} dato(s) antes de finalizar:</strong><ul>${issues.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul></div>` : ""}

      <div class="card">
        <div class="field">
          <label class="field-label">Observaciones generales de la visita</label>
          <textarea id="f-obsg" placeholder="Incidencias, acuerdos con la obra, seguimiento de no conformidades anteriores…">${escapeHtml(v.obsGenerales)}</textarea>
        </div>
        <div class="field">
          <label class="field-label">Técnico DAO (firma)</label>
          <input type="text" id="f-firma-tecnico" value="${escapeHtml(v.firmaTecnico || v.tecnico)}">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Representante contratista (firma)</label>
          <input type="text" id="f-firma-contratista" value="${escapeHtml(v.firmaContratista)}" placeholder="Nombre (opcional en campo)">
        </div>
      </div>

      <div class="section-title">Exportar / sincronizar</div>
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-outline" id="btn-word">Generar Word</button>
        <button class="btn btn-primary" id="btn-sync">${STATE.user ? "Sincronizar con Google" : "Sincronizar (inicia sesión)"}</button>
      </div>
      <button class="btn btn-secondary" id="btn-borrador">Guardar borrador y salir</button>
    </div>
  `;
  $("#btn-back").addEventListener("click", () => { persistCurrent(); STATE.temaFlowIdx = STATE.temaFlowOrder.length-1; goto("checklist"); });
  $("#f-obsg").addEventListener("input", e => v.obsGenerales = e.target.value);
  $("#f-firma-tecnico").addEventListener("input", e => v.firmaTecnico = e.target.value);
  $("#f-firma-contratista").addEventListener("input", e => v.firmaContratista = e.target.value);
  $("#btn-borrador").addEventListener("click", () => { persistCurrent(); goto("home"); });
  $("#btn-word").addEventListener("click", () => {
    persistCurrent();
    const remaining = pendingIssues(v);
    if(remaining.length){ toast("Completa los datos pendientes antes de generar el documento."); return; }
    generarWord(v);
  });
  $("#btn-sync").addEventListener("click", async () => {
    persistCurrent();
    const remaining = pendingIssues(v);
    if(remaining.length){ toast("Completa los datos pendientes antes de sincronizar."); return; }
    if(!STATE.user){ await googleSignIn(); if(!STATE.user) return; }
    syncVisita(v);
  });
}

  if(loginBtn2) loginBtn2.addEventListener("click", googleSignIn);

/* ---------------------------------------------------------------------- */
/* Toast                                                                    */
/* ---------------------------------------------------------------------- */
let toastTimer = null;
function toast(msg){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display="none"; }, 3200);
}

/* Arranque                                                                 */

loadVisitas();
render();
