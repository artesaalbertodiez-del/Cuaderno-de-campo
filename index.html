<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DAO FV Alentisque — Seguimiento ambiental</title>
<meta name="theme-color" content="#5A8A1F">
<style>
:root{
  --verde:#8DC63F; --verde-osc:#5A8A1F; --ink:#2B2E28; --ink-muted:#6B7268;
  --line:#D9D2BD; --good-bg:#E4F1DB; --good-tx:#3F7D22; --bad-bg:#F8E3E0;
  --bad-tx:#A83D30; --na-bg:#ECEAE2; --na-tx:#80786A; --head-bg:#F3F1E9;
  --bg:#FAF9F5; --card:#FFFFFF; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:16px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--verde-osc);color:#fff;
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.topbar .back{background:none;border:none;color:#fff;font-size:22px;padding:0 4px;line-height:1;}
.topbar h1{font-size:16px;margin:0;font-weight:700;flex:1;}
.topbar .sub{font-size:11.5px;opacity:.85;display:block;font-weight:400;margin-top:2px;}
.topbar .action{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;}

.brandbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;}
.brandbar img{height:30px;display:block;}
.brandbar .name{font-weight:700;color:var(--verde-osc);font-size:15px;}
.pill-btn{background:var(--head-bg);color:var(--verde-osc);border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;}

/* ---------- generic ---------- */
.container{padding:14px 16px 100px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.muted{color:var(--ink-muted);}
.small{font-size:12.5px;}
.center{text-align:center;}
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.02em;}
.field{margin-bottom:14px;}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
.field textarea{min-height:72px;resize:vertical;}
.field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--verde-osc);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:13px 18px;font-size:15px;font-weight:700;width:100%;}
.btn-primary{background:var(--verde-osc);color:#fff;}
.btn-primary:disabled{background:#b9c9a8;color:#fff;opacity:.7;}
.btn-secondary{background:var(--head-bg);color:var(--ink);border:1.5px solid var(--line);}
.btn-outline{background:#fff;color:var(--verde-osc);border:1.5px solid var(--verde-osc);}
.btn-danger-text{background:none;color:var(--bad-tx);font-weight:600;width:auto;padding:8px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
.login-wrap img.logo{height:52px;margin-bottom:8px;}
.login-wrap h2{margin:18px 0 4px;font-size:19px;}
.login-wrap p{color:var(--ink-muted);font-size:13.5px;max-width:320px;margin:0 0 26px;}
#gsi-login-btn{margin-top:6px;}

/* ---------- fase pill ---------- */
.fase-pills{display:flex;gap:8px;margin-bottom:14px;}
.fase-pill{flex:1;padding:11px 8px;border-radius:10px;text-align:center;font-size:12.5px;font-weight:700;background:var(--head-bg);color:var(--ink-muted);border:1.5px solid var(--line);}
.fase-pill.on{background:var(--verde-osc);color:#fff;border-color:var(--verde-osc);}

/* ---------- home list ---------- */
.visita-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.visita-num{width:42px;height:42px;border-radius:50%;background:var(--head-bg);color:var(--verde-osc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;}
.visita-info{flex:1;min-width:0;}
.visita-info .t1{font-weight:700;font-size:14.5px;}
.visita-info .t2{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.badge-draft{background:var(--na-bg);color:var(--na-tx);}
.badge-synced{background:var(--good-bg);color:var(--good-tx);}
.badge-error{background:var(--bad-bg);color:var(--bad-tx);}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-muted);}
.empty-state svg{opacity:.5;margin-bottom:10px;}

.fab{position:fixed;right:calc(50% - 280px + 20px);bottom:24px;z-index:30;}
@media (max-width:560px){ .fab{right:20px;} }
.fab button{width:58px;height:58px;border-radius:50%;background:var(--verde-osc);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(90,138,31,.4);display:flex;align-items:center;justify-content:center;}

/* ---------- apartados (tema toggle list) ---------- */
.tema-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;}
.tema-row .txt{flex:1;}
.tema-row .txt .n{font-weight:700;font-size:13.5px;}
.tema-row .txt .c{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.switch{position:relative;width:46px;height:27px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:#D9D2BD;border-radius:20px;transition:.15s;}
.switch .slider:before{content:"";position:absolute;height:21px;width:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--verde-osc);}
.switch input:checked + .slider:before{transform:translateX(19px);}

/* ---------- checklist ---------- */
.progress-dots{display:flex;gap:5px;justify-content:center;padding:10px 0 2px;}
.progress-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);}
.progress-dots span.on{background:#fff;}
.item-row{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.item-head{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.item-head .cod{font-weight:800;color:var(--verde-osc);font-size:12.5px;flex:none;min-width:34px;}
.item-head .res{flex:1;font-size:13.5px;line-height:1.35;}
.item-head .chev{color:var(--ink-muted);font-size:12px;flex:none;margin-top:2px;}
.item-body{padding:0 14px 14px;border-top:1px dashed var(--line);}
.item-body .full-text{font-size:12px;color:var(--ink-muted);margin:10px 0;line-height:1.5;}
.item-meta{font-size:10.5px;color:var(--ink-muted);margin-bottom:10px;}

.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);margin:10px 0;}
.seg button{flex:1;border:none;background:#fff;padding:9px 4px;font-size:12px;font-weight:700;color:var(--ink-muted);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.sel-cumple{background:var(--good-bg);color:var(--good-tx);}
.seg button.sel-no_cumple{background:var(--bad-bg);color:var(--bad-tx);}
.seg button.sel-na{background:var(--na-bg);color:var(--na-tx);}
.item-row.st-cumple .item-head{border-left:4px solid var(--good-tx);}
.item-row.st-no_cumple .item-head{border-left:4px solid var(--bad-tx);}
.item-row.st-na .item-head{border-left:4px solid var(--na-tx);}
.item-row.st-pendiente .item-head{border-left:4px solid var(--line);}

.photos-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{position:absolute;top:0;right:0;background:rgba(43,46,40,.75);color:#fff;border:none;width:18px;height:18px;font-size:11px;line-height:1;border-radius:0 0 0 6px;}
.add-photo-btn{width:64px;height:64px;border-radius:8px;border:1.5px dashed var(--line);background:#fff;color:var(--ink-muted);font-size:22px;display:flex;align-items:center;justify-content:center;}

.bottombar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:15;}
.bottombar .btn{flex:1;}

.stats-row{display:flex;text-align:center;margin:8px 0 16px;}
.stats-row .s{flex:1;}
.stats-row .s .n{font-size:20px;font-weight:800;}
.stats-row .s .l{font-size:10.5px;color:var(--ink-muted);}

.alert-box{background:var(--bad-bg);color:var(--bad-tx);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
.alert-box ul{margin:6px 0 0;padding-left:18px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:90%;text-align:center;}

.section-title{font-size:13px;font-weight:800;color:var(--verde-osc);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0;}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}

</style>
</head>

<script>
const TEMAS_DATA = [{"num": 1, "nombre": "OCUPACIÓN DEL TERRITORIO", "items": [{"codigo": "1.1", "resumen": "Zonas de valor natural y hábitats prioritarios señalizadas", "texto": "Se señalizarán las zonas con valor natural, fundamentalmente las zonas de cruce de los arroyos y cauces de agua. Se delimitarán y señalizarán las zonas con hábitat catalogados como prioritarios que se encuentren en el área de ocupación de la obra y en el radio de acción de la maquinaria, para evitar en lo posible afecciones sobre los mismos.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "ambas", "faseOriginal": "Previo a Construcción y Construcción"}, {"codigo": "1.2", "resumen": "Zona de obras, paso de maquinaria y acopios jalonados", "texto": "Se jalonará la zona de obras, zona de paso de maquinaria, zonas de acopio e instalaciones auxiliares, para así minimizar el posible daño a la vegetación colindante, la compactación de suelos y garantizar la protección de la fauna sensible.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "ambas", "faseOriginal": "Previo a Construcción y Construcción"}, {"codigo": "1.3", "resumen": "Zonas auxiliares fuera de vegetación natural y cauces", "texto": "Las ubicaciones de las zonas auxiliares de obra (parque de maquinaria, punto limpio, zonas de acopio, etc.) evitarán las zonas con vegetación natural y las cercanías de los cauces de agua.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "1.4", "resumen": "Ocupación limitada a zonas autorizadas (camino, estructuras, CT)", "texto": "La explanación del camino, las zonas donde se ubicarán las estructuras y las plataformas de los centros de transformación constituyen las únicas zonas del terreno que pueden ser ocupadas, debiendo permanecer el resto del territorio, en lo posible, en su estado natural, por lo que no podrá ser usado, bajo ningún concepto, para circular o estacionar vehículos, o para acopiar materiales.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "1.5", "resumen": "Cabeceras de barrancos y cauces sin ocupar ni interrumpir", "texto": "No se ocuparán cabeceras de barrancos ni se interrumpirán los cauces naturales o artificiales de agua.", "tipo": "MP", "frecuencia": "Inspección visual semanal en cauces", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "1.6.1", "resumen": "Vallado perimetral ejecutado según proyecto (distancias, puertas, malla)", "texto": "1.6) VALLADO: El cerramiento perimetral exterior se realizará respetando las directrices recomendadas por el ayuntamiento de Alentisque, colocando éste a una distancia mínima respecto de los caminos y parcelas colindantes y respetando el resto de servidumbres marcadas por ley respecto de carreteras, cauces, restos arqueológicos, etc. Se preverá una puerta para el acceso de vehículos y de personal en cada uno de los accesos. La puerta de acceso a la planta fotovoltaica será de doble hoja abatible, con marco metálico, disponiendo de cerradura con resbalón, manilla, condena y bombín. La anchura de dicho portón será de 5 metros. El vallado perimetral de la planta se realizará con valla cinegética con una luz de malla de al menos 15 cm. Se realizarán aperturas a ras de suelo en forma de rectángulos de 30 cm en sentido horizontal y 20 cm en sentido vertical enmarcado por listones de hacer corrugado cada 200 metros Se realizará de tal forma que no impida el tránsito de la fauna silvestre. No se enterrará el mallado para permitir el paso de pequeños vertebrados. Se evitará la cementación de bloque de hormigón en la parte inferior de la malla para permitir a ciertos mamíferos excavar pasos que comuniquen el exterior con el interior. Se prohíbe expresamente la incorporación de materiales o soluciones potencialmente peligrosas como vidrios, espinos, filos y puntas. El vallado se señalizará con elementos de alta visibilidad, prioritariamente naturales, para evitar la colisión de las aves. Dispondrá en todo su trazado de señales reflectantes intercaladas en la malla cada 10 metros para así disminuir la posibilidad de impactos de la avifauna.", "tipo": "MP", "frecuencia": "Semanal durante la construcción del vallado", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "1.6.2", "resumen": "Vallado no interrumpe cursos de agua ni favorece erosión", "texto": "1.6) VALLADO: No interrumpirá los cursos naturales de agua ni favorecerá la erosión ni el arrastre de tierras.", "tipo": "MP", "frecuencia": "Semanal durante la construcción del vallado y al final de la obra.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "1.7", "resumen": "Uso prioritario de caminos existentes; nuevos trazados según ficha técnica", "texto": "Maximizar la utilización de los caminos existentes en la zona, definiendo nuevos trazados únicamente en los casos imprescindibles de forma que se respete la rasante del terreno natural. Adecuación de los caminos existentes que no alcancen los mínimos necesarios. Características de los viales que se ejecutarán: • La anchura mínima necesaria es de 5 m en los viales. • Los viales de nueva construcción requerirán en cada caso excavación o relleno de terraplén y relleno de zahorras con espesor mínimo de 25 cm. Será necesario disponer de cunetas y pasos de agua para la evacuación del agua de lluvia a ambos lados del camino. En todo caso se buscará preservar el discurso de las aguas de escorrentía por sus cursos naturales. • El radio del eje de curvatura requerido es de 10 m; en casos excepcionales se estudiará la posibilidad de realizar sobreanchos. • Pendiente máxima del 9% para viales y del 14% en caso de viales asfaltados. • Los terraplenes se realizarán 3/2 y los desmontes 1/2 como mínimo. • La construcción de los nuevos caminos, o la mejora de los existentes, debe ir acompañada de un sistema de drenaje longitudinal y transversal adecuado, que permita la evacuación del agua de la calzada y la procedente de las laderas contiguas. • El drenaje transversal se soluciona con el bombeo de un 1% de la calzada, evacuando así las aguas lateralmente.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "1.8", "resumen": "Zonas de acopio liberadas restauradas a cultivo o vegetación autóctona", "texto": "Las zonas temporales de acopios y que posteriormente queden libres deberán restablecerse para cultivos o bien especies autóctonas.", "tipo": "MC", "frecuencia": "Semanal durante el Plan de restauración", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}]}, {"num": 2, "nombre": "CONTROL DE EMISIONES ATMOSFÉRICAS, RUIDO Y CONTAMINACIÓN LUMÍNICA", "items": [{"codigo": "2.1", "resumen": "Maquinaria con ITV en vigor y emisiones dentro de norma", "texto": "La maquinaria deberá cumplir con los requisitos en cuanto a inspecciones técnicas (ITV), de manera que se certifique que los procesos de combustión de carburantes son correctos y se hallan dentro de la legislación en cuanto a emisión para CO, C, NOx, hidrocarburos.", "tipo": "MP/MS", "frecuencia": "Semanal y al final de la obra. Al finalizar la obra, determinación de las zonas que se deben dejar desocupadas.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "2.2", "resumen": "Acopios pulverulentos protegidos del viento o regados", "texto": "Evitar el almacenamiento de materiales en lugares que no se encuentren al abrigo del viento, o riego de los acopios pulverulentos y caminos de acceso utilizados por la maquinaria.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "2.3", "resumen": "Materiales pulverulentos transportados en camiones con lona", "texto": "Traslado de los materiales pulverulentos en camiones cubiertos con lonas.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "3.1", "resumen": "Obras ejecutadas en el menor tiempo posible (molestias a población)", "texto": "Con el fin de minimizar las molestias a la población, las obras se realizarán en el menor tiempo posible.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "3.2", "resumen": "Mediciones periódicas de ruido dentro de límites legales", "texto": "Se realizarán mediciones periódicas de ruido para comprobar que los niveles sonoros generados durante las labores de mantenimiento de la planta solar se encuentran dentro de los límites establecidos por la ley.", "tipo": "MC", "frecuencia": "Al inicio de las obras, a mitad del desarrollo de la obra y a fin de obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "4.1", "resumen": "Iluminación nocturna minimizada; luminarias adecuadas (>440 nm, hacia el suelo)", "texto": "Se evitará la iluminación de la planta siempre que sea posible, limitando la iluminación nocturna al mínimo y utilizando lámparas que emitan luz con longitudes de onda superiores a 440 nm. Los puntos de luz nunca serán de tipo globo y se procurará que el tipo empleado no disperse el haz luminoso, que verá enfocarse hacia abajo. (Inf. IDAA: Se evitará la iluminación nocturna de la planta fotovoltaica, así como los trabajos nocturnos durante la construcción, con las únicas excepciones de sistemas requeridos por la normativa y de dispositivos de iluminación imprescindibles en las edificaciones auxiliares o para hacer frente a situaciones de riesgo. En tal caso, se utilizarán luminarias que no emitan luz blanca rica en longitudes de onda corta (azules y UV), la iluminación se proyectará hacia el suelo por debajo del plano horizontal, y se limitará a lo estrictamente necesario).", "tipo": "MP", "frecuencia": "Semanal y al final de la obra durante la fase de construcción A determinar durante la fase de funcionamiento", "origen": "EsIA   \n IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 3, "nombre": "GEOMORFOLOGÍA, EROSIÓN Y SUELOS", "items": [{"codigo": "5.1", "resumen": "Trazado de pistas optimizado para reducir movimiento de tierras", "texto": "Se intentará optimizar el trazado de las pistas de servicio de manera que se reduzca el volumen de tierras a mover.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "previa", "faseOriginal": "Previo a Construcción"}, {"codigo": "5.2", "resumen": "Gestión y transporte de materiales planificado, sin plataformas extra", "texto": "Se establecerá una planificación correcta y pensada en la gestión y transporte de materiales de construcción y piezas de la planta, así como una buena gestión en el transporte y almacenamiento de los mismos, que evitará la construcción de plataformas adicionales dedicadas al almacenamiento de los mismos.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "previa", "faseOriginal": "Previo a Construcción"}, {"codigo": "5.3", "resumen": "Tierra vegetal separada de la extraída en profundidad", "texto": "Durante los movimientos de tierra se ha de separar adecuadamente la tierra vegetal procedente del nivel superficial de la extraída en profundidad con mayor porcentaje de rocas, para la posterior reposición de la cubierta vegetal deteriorada.", "tipo": "MC", "frecuencia": "Antes del inicio de la obra y cada vez que se deba delimitar una zona de acopio. Supervisión visual semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.4", "resumen": "Procedimiento constructivo minimiza alteración del suelo y escorrentía", "texto": "Durante las obras, se seleccionará el procedimiento de construcción que minimice la alteración de la capa superficial del suelo, respetando la vegetación existente, minimizando los movimientos de tierra en la superficie de la planta, así como los acopios de cualquier tipo de material y zonas auxiliares deberán disponerse dentro del perímetro del proyecto, fuera de las áreas naturales a conservar y evitando la evacuación de solidos por escorrentía superficial.", "tipo": "MC", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.5", "resumen": "Paneles instalados mediante hincado; vegetación bajo paneles preservada", "texto": "La instalación de los paneles debe de realizarse mediante hincado, ocupando la mínima superficie de suelo posible. Respecto a la vegetación del sustrato bajo los paneles solares, deberán permitir el desarrollo de vegetación herbácea y arbustiva dejando una distancia al suelo de al menos 0,5 m que favorezca su presencia sin que esta interfiera con el correcto funcionamiento de la planta ni al mantenimiento o seguimiento de la misma.", "tipo": "MC", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.6", "resumen": "Superficies compactadas descompactadas al finalizar obra", "texto": "Una vez terminadas las labores de construcción, se deberán descompactar las superficies de terreno ocupadas de forma continuada durante la construcción del proyecto, siempre y cuando no constituyan un acceso al mismo. La descompactación se realizará mediante la roturación de la zona afectada y la posterior nivelación.", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.7", "resumen": "Residuos y materiales de obra retirados al finalizar", "texto": "Una vez terminadas las labores de construcción, eliminación de los residuos y materiales generados durante las obras, retirada inmediata de materiales acumulados, más aún si supusiera un impedimento, obstáculo o peligro para el tránsito de peatones o vehículos, así como la adecuada actuación en caso de vertidos accidentales y restitución del estado original del terreno previo a la actuación.", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.8", "resumen": "Caminos utilizados restituidos a su estado original", "texto": "Una vez terminadas las labores de construcción, restitución del estado original de caminos que hubiera sido necesario utilizar en la fase de construcción y hubiesen resultado alterados o dañados. Se rehabilitarán los daños efectuados a las propiedades durante la construcción o bien se efectuará una compensación económica por los mismos.", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.9", "resumen": "Zonas auxiliares (parque maquinaria, viales, etc.) restauradas", "texto": "Una vez terminadas las labores de construcción, restauración de zonas afectadas (parque de maquinaria, viario de acceso a las obras, instalaciones auxiliares, etc.): eliminación adecuada de cualquier vertido accidental, una vez hayan finalizado todos los trabajos asociados a la construcción de las diferentes infraestructuras, restituyendo la forma y aspectos originales del terreno.", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "5.10", "resumen": "Derrames accidentales retirados y almacenados en recipientes homologados", "texto": "Para evitar la contaminación de suelos, en caso de producirse derrames accidentales, deberán retirarse en el momento de su vertido y acumularse en recipientes homologados hasta su retirada por empresa autorizada.", "tipo": "MC", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "5.11", "resumen": "Uso de caminos preexistentes; sin caminos viciados nuevos", "texto": "Se evitará al máximo la creación de caminos viciados utilizando cuando sea posible los caminos preexistentes.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "5.12", "resumen": "Cambios de aceite controlados, sin vertidos, gestor autorizado", "texto": "Los cambios de aceite de la maquinaria utilizada en la construcción de la planta se realizarán con especial precaución evitando posibles vertidos, recogiéndose en bidones y depósitos destinados a tal fin, haciéndolos llegar a un gestor de residuos autorizado.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 4, "nombre": "CALIDAD DE AGUAS SUPERFICIALES", "items": [{"codigo": "6.1", "resumen": "Dinámica hídrica y calidad de aguas superficiales preservada", "texto": "Deberán garantizar la no alteración significativa de la dinámica hídrica de la zona y asegurar en todo momento la calidad de las aguas superficiales y subterráneas, garantizando el drenaje de las aguas superficiales, manteniendo los márgenes limpios, no afectando a la vegetación de la ribera, disponiendo de sistemas eficiente para la recogida y evacuación de la zona de lluvia.", "tipo": "MP", "frecuencia": "Inspección visual semanal en cauces", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "6.2", "resumen": "Retención de sólidos antes de evacuar escorrentía; acopios sin riesgo de vertido", "texto": "Durante los movimientos de tierras, se deberán establecer las medidas necesarias para la retención de sólidos previa a la evacuación de las aguas de escorrentía superficial, así como otras posibles medidas para reducir al mínimo el riesgo de contaminación de las aguas superficiales. Cualquier acopio de materiales se ubicará de manera que se impida cualquier riesgo de vertido, ya sea directo o indirecto; por escorrentía, erosión, infiltración u otros mecanismos sobre las aguas superficiales o subterráneas.", "tipo": "MP", "frecuencia": "Al comienzo y al final de movimientos de tierras. Inspección visual semanal en cauces", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "6.3", "resumen": "Respeto de la servidumbre de 5 m del DPH; sin instalaciones en Zona de Flujo Preferente", "texto": "Se deberá realizar el proyecto respetando el dominio público hidráulico y su zona de servidumbre 5 metros de anchura de los cauces públicos, según establece el artículo 6 del Real Decreto Legislativo 1/2001, no colocando ningún tipo de instalación (como módulos fotovoltaicos y líneas eléctricas) en la Zona de Flujo Preferente que puedan suponer un obstáculo a los cauces, permanentes y temporales, presentes en la zona del proyecto. Los cerramientos y vallados que se implanten en la zona de flujo preferente, deben ser en todo caso permeables. No se debe poner en riesgo la capacidad de desagüe por modificaciones de terreno en estas zonas y se debe evitar el acopio en la Zona de flujo preferente de materiales que puedan ser arrastrados o puedan degradar el DPH, así como evitar el almacenamiento de residuos de todo tipo. En cualquier caso, se deberá consultar al organismo de cuenca correspondiente en relación a las posibles afecciones que se produzcan sobre dominio público hidráulico, así como las medidas preventivas y correctoras a adoptar.", "tipo": "MP", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "6.4", "resumen": "Materiales sobrantes y residuos retirados al finalizar obra", "texto": "Una vez terminadas las labores de construcción, eliminación adecuada de los materiales sobrantes en las obras y de cualquier residuo almacenado. Si se produce algún vertido accidental durante la construcción se retirará y será depositado en vertedero autorizado.", "tipo": "MC", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "6.5", "resumen": "Sin cambios de aceite ni combustible cerca del medio hídrico", "texto": "Prohibición expresa de cambios de aceite o almacenamiento de combustibles próximo al medio hídrico y realizándolos en lugares autorizados.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.6", "resumen": "Cauces balizados en la zona de trabajo", "texto": "Se balizarán todos los cauces de la zona de trabajo para evitar su afección.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.7", "resumen": "Sin vertidos contaminantes en el entorno", "texto": "Se vigilará y controlará la no realización de vertidos contaminantes en el entorno afectado.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.8", "resumen": "Sin instalaciones para personas dentro del DPH", "texto": "En ningún caso se autorizarán dentro del DPH la construcción montaje o ubicación de instalaciones destinadas albergar personas, aunque sea con carácter provisional o temporal, de acuerdo con lo establecido en el artículo 77 del Reglamento de DPH.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Cada dos meses en fase de funcionamiento", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.9", "resumen": "Autorización de Confederación Hidrográfica para actuaciones en DPH", "texto": "Será necesario la autorización para actuaciones en el Dominio Público Hidráulico por parte de Confederación Hidrográfica del Duero y del Ebro en cada caso.", "tipo": "MP", "frecuencia": "Al inicio de la obra", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.10", "resumen": "Autorización de Confederación para actuaciones en zona de policía de cauces", "texto": "Se ha de considerar que toda actuación que realice en la zona de policía de cualquier cauce público deberá contar con la preceptiva autorización de la Confederación, según establece la vigente legislación de aguas, y en particular las actividades mencionadas en el artículo 9 del Reglamento del DPH.", "tipo": "MP", "frecuencia": "Al inicio de la obra", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "6.11", "resumen": "Autorización para captaciones de agua del DPH", "texto": "En caso de realización de captaciones de aguas directamente del DPH o de cualquier otra actividad se deberá disponer de la correspondiente autorización, cuyo otorgamiento corresponde a la Confederación. En todo caso se atenderá a lo que indique en relación a las medidas a tener en cuenta.", "tipo": "MP", "frecuencia": "Al inicio de la obra", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 5, "nombre": "GESTIÓN DE VERTIDOS, DERRAMES Y RESIDUOS", "items": [{"codigo": "7.1", "resumen": "Mantenimiento de maquinaria en talleres externos o zonas habilitadas", "texto": "Las operaciones de mantenimiento de maquinaria se realizarán preferentemente en talleres externos, en caso de averías de la maquinaria en la propia obra se realizará en zonas habilitadas al efecto.", "tipo": "MP", "frecuencia": "Al comienzo de la obra y cada dos meses.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "7.2", "resumen": "Excedentes de estériles trasladados a vertedero autorizado", "texto": "Los excedentes de estériles se trasladarán a vertedero autorizado.", "tipo": "MC", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "7.3", "resumen": "Empresas inscritas como Pequeños Productores de Residuos Peligrosos", "texto": "Las empresas que trabajen en la construcción de las instalaciones deberán inscribirse como Pequeños Productores de Residuos Peligrosos.", "tipo": "MP", "frecuencia": "Al comienzo del inicio de los trabajos de cada empresa", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "7.4", "resumen": "Residuos no peligrosos retirados a lugares autorizados", "texto": "Los residuos no peligrosos serán retirados y trasladados a lugares autorizados", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "7.5", "resumen": "Derrames accidentales retirados y almacenados correctamente", "texto": "Para evitar la contaminación de suelos, en caso de producirse derrames accidentales, deberán retirarse en el momento de su vertido y acumularse en recipientes homologados hasta su retirada por empresa autorizada.", "tipo": "MC", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "7.6", "resumen": "Residuos peligrosos/inflamables en recipientes incombustibles cerrados", "texto": "En caso de existir desperdicios de combustibles, inflamables o peligrosos, se depositarán a medida que se produzcan en recipientes incombustibles cerrados. Los recipientes para estopa, trapos y materiales impregnados de sustancias, serán de cierre automático.", "tipo": "MP", "frecuencia": "Semanal en fase de construcción Quincenal en fase de funcionamiento", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 6, "nombre": "VEGETACIÓN", "items": [{"codigo": "8.1", "resumen": "Afección a pies arbóreos evitada en el replanteo", "texto": "En la fase de replanteo se evitará lo máximo posible la afección sobre pies arbóreos, situados en el perímetro o línea exterior de la planta del proyecto.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "previa", "faseOriginal": "Previo a Construcción"}, {"codigo": "8.2", "resumen": "Muestreo de flora amenazada realizado antes de obras", "texto": "Se deberá realizar un muestreo de campo exhaustivo previo las obras de construcción del complejo solar en la zona de actuación y su área de influencia (en torno a 1 km), así como en las masas forestales circundantes o de ribera, con el fin de detectar posibles especies amenazadas de flora por si hay que establecer medidas preventivas adicionales, debiendo comunicarse al Servicio Provincial de Medio Ambiente de Soria de la Junta de Castilla y León.", "tipo": "MP", "frecuencia": "Un mes antes del inicio de las obras", "origen": "IDAA", "fase": "previa", "faseOriginal": "Previo a Construcción"}, {"codigo": "8.3", "resumen": "Inicio de obras comunicado a Medio Ambiente (Junta CyL)", "texto": "Se ha de poner en conocimiento el inicio de las obras a la Consejería de Medio Ambiente de la Junta de Castilla y León para que pueda tomar medidas pertinentes en los Planes de Prevención y Extinción de Incendios Comarcales o en los que consideren oportuno.", "tipo": "MP", "frecuencia": "Un mes antes del inicio de las obras", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.4", "resumen": "Tránsito de maquinaria limitado a zonas delimitadas", "texto": "Las zonas de tránsito de maquinaria se reducirán a las áreas delimitadas, evitando la degradación de zonas adyacentes y la eliminación o deterioro innecesario de la vegetación existente. Como medida protectora, las máquinas no podrán salirse de las vías de acceso para evitar dañar al máximo las manchas de vegetación natural.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.5", "resumen": "Sin derrames de aceites/lubricantes que afecten a la flora", "texto": "Se ha de evitar cualquier derrame de sustancias contaminantes, tales como aceites y otros lubricantes de máquinas que puedan contaminar el suelo y, por tanto, impedir el desarrollo normal de la flora.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.6", "resumen": "Trazado de accesos minimiza afección a vegetación de mayor valor", "texto": "El trazado de los accesos debe minimizar el paso por las teselas de vegetación de valor mayor, a la vez que se busca su diseño enlazando las teselas de menor valor representadas por los cultivos herbáceos extensivos y matorrales secundarios.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.7", "resumen": "Pantalla vegetal perimetral plantada (especies autóctonas)", "texto": "Con el fin de disminuir la exposición visual de la planta y favorecer la creación de áreas de refugio y cría de la fauna, se propone la creación de una pantalla vegetal lineal. Esta pantalla se plantará en el interior del vallado, paralelo al mismo, en lado norte de la planta que tiene mayor exposición a la carretera CL-116 y a la localidad de Alentisque. Tendrá una longitud de unos 650 metros lineales. Deberán plantarse especies autóctonas adaptadas a las condiciones naturales de la zona de estudio, como por ejemplo encina (Quercus rotundifolia), quejigo (Quercus faginea), romero (Rosmarinus officinalis) y rosas silvestres (Rosa micrantha, Rosa pouzinii). Los plantones serán de al menos 2 savias y se plantarán a una distancia de 2 metros. Tendrán un mantenimiento durante los primeros 3 años y se repondrán las marras que se produzcan durante ese periodo que se estiman en un 30%.", "tipo": "MCP", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.8", "resumen": "Vegetación natural favorecida entre filas de paneles; sin herbicidas", "texto": "Se favorecerá el desarrollo, siempre que sea posible, de vegetación natural en los márgenes y en las calles intermedias entre filas de paneles mediante revegetación natural. Se evitará el uso de herbicidas para controlar la vegetación, empleando medios manuales o preferiblemente el pastoreo.", "tipo": "MCP", "frecuencia": "Al final de la obra", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.9.1", "resumen": "Faja perimetral de protección contra incendios (30 m) mantenida", "texto": "\"Aplicación del RD 893/2013, de 25 de noviembre por el que se aprueba la Directriz básica de planificación de protección civil de emergencia por incendios forestales: A fin de disminuir o romper la continuidad de los combustibles forestales se deberá asegurar la existencia de una faja perimetral de protección de 30 metros de ancho dentro de la misma propiedad, alrededor de la urbanización, edificación o instalación, medida desde el límite exterior de la edificación o instalación destinada a las personas, libre de vegetación seca y con la masa arbórea aclarada. Siempre que sea posible, esta faja deberá ser de, al menos, ocho veces la altura de la vegetación dominante.\"", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.9.2", "resumen": "Medidas de autoprotección en Zonas de Alto Riesgo de incendio", "texto": "Aplicación del RD 893/2013, de 25 de noviembre por el que se aprueba la Directriz básica de planificación de protección civil de emergencia por incendios forestales: En las zonas de alto riesgo (ZAR) de incendio declaradas por cada Comunidad Autónoma, será necesario adoptar medidas especiales de autoprotección pasiva de la edificación o instalación frente a posibles fuentes de ignición procedente de incendios forestales.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.9.3", "resumen": "Pistas cumplen características de servidumbre contraincendios", "texto": "Aplicación del RD 893/2013, de 25 de noviembre por el que se aprueba la Directriz básica de planificación de protección civil de emergencia por incendios forestales: Las infraestructuras de servicio a las edificaciones o instalaciones incluidas en zonas de alto riesgo (ZAR) de incendio, tendrán, según lo establecido en el artículo 48.6 de la Ley 43/2003, de 21 de noviembre, servidumbre de uso para su utilización por los servicios de prevención y extinción de incendios. A estos efectos las pistas que se realicen habrán de reunir las siguientes características: • Ancho de la vía de cinco metros en viales con dirección en dos sentidos, y a tres metros en viales de sentido único. Se establecerá en estas vías la debida señalización de acuerdo con las normas de tráfico: • Radio mínimo de giro interior de las curvas: 5 metros. • Gálibo de seguridad de poda de árboles: 5 metros. • Pendiente de la vía: inferior al 12%, pudiendo llegar ocasionalmente al 20% como máximo. • Zonas de cambio de sentido para cada kilómetro de vía, debiendo ser de 200 metros cuadrados y 8 metros mínimo de largo.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.9.4", "resumen": "Sistemas de defensa contra incendios señalizados", "texto": "Aplicación del RD 893/2013, de 25 de noviembre por el que se aprueba la Directriz básica de planificación de protección civil de emergencia por incendios forestales: Todos los sistemas de defensa contra incendios deberán estar adecuadamente señalizados, de acuerdo con la normativa en vigor.", "tipo": "MP", "frecuencia": "Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.10", "resumen": "Afección a vegetación de lindes en zanjas minimizada", "texto": "A la hora de realizar las zanjas, se minimizará su afección con la vegetación de las lindes evitando su afección y si fuese necesario de procederá a su restauración y mejora. De igual modo, los caminos públicos de paso para acceso a la instalación deberán mantenerse en perfectas condiciones de uso, evitando su deterioro, así como las ocupaciones que dificulten el tránsito o la funcionalidad de los mismos.", "tipo": "MC", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.11", "resumen": "Procedimiento constructivo respeta la vegetación existente", "texto": "Durante las obras, se seleccionará el procedimiento de construcción que minimice la alteración de la capa superficial del suelo, respetando la vegetación existente, minimizando los movimientos de tierra en la superficie de la planta, así como los acopios de cualquier tipo de material y zonas auxiliares deberán disponerse dentro del perímetro del proyecto, fuera de las áreas naturales a conservar y evitando la evacuación de solidos por escorrentía superficial.", "tipo": "MC", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.12", "resumen": "Paneles instalados por hincado; vegetación bajo paneles conservada", "texto": "La instalación de los paneles debe de realizarse mediante hincado, ocupando la mínima superficie de suelo posible. Respecto a la vegetación del sustrato bajo los paneles solares, deberán permitir el desarrollo de vegetación herbácea y arbustiva dejando una distancia al suelo de al menos 0,5 m que favorezca su presencia sin que esta interfiera con el correcto funcionamiento de la planta ni al mantenimiento o seguimiento de la misma.", "tipo": "MC", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "8.13", "resumen": "Plan de Autoprotección frente a incendios vigente y actualizado", "texto": "Se deberá de disponer de un Plan de Autoprotección, estableciendo las actuaciones a desarrollar con los medios propios de que se dispongan, para los casos de emergencia por incendios forestales que puedan afectarles. Tendrá un mantenimiento, con comprobación periódica de los sistemas de alerta y avisos, actualización de medios y recursos, formalización y actualización del personal actuante, contemplando especialmente los simulacros.", "tipo": "MP", "frecuencia": "Mensual", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 7, "nombre": "FAUNA", "items": [{"codigo": "9.1", "resumen": "Muestreo de fauna amenazada/nidificante realizado antes de obras", "texto": "Se deberá realizar un muestreo de campo exhaustivo previo las obras de construcción del complejo solar en la zona de actuación y su área de influencia (en torno a 1 km), así como en las masas forestales circundantes o de ribera, con el fin de detectar posibles especies amenazadas de flora y de fauna para identificar la posibilidad de aves nidificando en la zona y en sus inmediaciones por si hay que establecer medidas preventivas adicionales, debiendo comunicarse al Servicio Provincial de Medio Ambiente de Soria de la Junta de Castilla y León.", "tipo": "MP", "frecuencia": "Un mes antes del inicio de las obras", "origen": "IDAA", "fase": "previa", "faseOriginal": "Previo a Construcción"}, {"codigo": "9.2", "resumen": "Obras fuera de época de reproducción (abr-jun) o cría descartada", "texto": "Las obras se realizarán fuera de la época de reproducción de la fauna, principalmente entre los meses de abril y junio, si bien se podrán realizar trabajos fuera de esa época siempre que durante el seguimiento ambiental de la obra se constate que no crían especies protegidas o de interés en un radio de 1 km de la zona de instalación. (Inf. IDAA: Se respetará el periodo de nidificación para aquellos trabajos que puedan incidir en la avifauna, presentando un plan de trabajo que minimice su afección, estableciendo un calendario de obras se fijará en coordinación con el Servicio Territorial de Medio Ambiente).\"", "tipo": "MP", "frecuencia": "Un mes antes del inicio de las obras semanal durante la época de cría", "origen": "EsIA   \n IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.3", "resumen": "Vallado con malla cinegética ≥15 cm y aperturas para fauna", "texto": "El vallado perimetral de la planta se realizará con valla cinegética con una luz de malla de al menos 15 cm. Se realizarán aperturas a ras de suelo en forma de rectángulos de 30 cm en sentido horizontal y 20 cm en sentido vertical enmarcado por listones de hacer corrugado cada 200 metros. (Inf. IDAA: En relación con el vallado y con objeto de garantizar un adecuado nivel de permeabilidad, deberían instalarse pasos de fauna a lo largo de todo el perímetro del vallado. Se proponen aperturas de éste a ras de suelo en forma de rectángulos de 30 cm en sentido horizontal y 20 cm en sentido vertical, enmarcado por listones de acero corrugado, cada 200 m, evitando la cimentación en todo caso). \"", "tipo": "MC", "frecuencia": "Semanal durante la construcción del vallado", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.4", "resumen": "Vallado no enterrado; permite paso de pequeños vertebrados", "texto": "El vallado se realizará de tal forma que no impida el tránsito de la fauna silvestre. No se enterrará el mallado para permitir el paso de pequeños vertebrados. Se evitará la cementación de bloque de hormigón en la parte inferior de la malla para permitir a ciertos mamíferos excavar pasos que comuniquen el exterior con el interior.", "tipo": "MC", "frecuencia": "Semanal durante la construcción del vallado", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.5", "resumen": "Sin materiales peligrosos en el vallado (vidrios, espinos, puntas)", "texto": "Se prohíbe expresamente la incorporación de materiales o soluciones potencialmente peligrosas como vidrios, espinos, filos y puntas.", "tipo": "MC", "frecuencia": "Semanal durante la construcción del vallado", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.6", "resumen": "Vallado señalizado con elementos de alta visibilidad para aves", "texto": "El vallado se señalizará con elementos de alta visibilidad, prioritariamente naturales, para evitar la colisión de las aves. Dispondrá en todo su trazado de señales reflectantes intercaladas en la malla cada 10 metros para así disminuir la posibilidad de impactos de la avifauna. (Inf. IA: Se instalarán pequeñas placas de color claro cada 10 metros del vallado y de la subestación para aumentar su visibilidad).", "tipo": "MC", "frecuencia": "Semanal durante la construcción del vallado", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.7", "resumen": "Bandas anticolisión en paneles instaladas", "texto": "Se recomienda el uso de bandas sobre los paneles fotovoltaicos en forma de rejilla que minimicen la mortalidad de insectos y los posibles impactos de pequeñas aves. Sería recomendable que no todos los paneles se recubrieran con el fin de profundizar en el análisis de las afecciones, con el fin de evaluar los efectos a lo largo de los primeros años estableciéndolos en el programa de vigilancia ambiental.", "tipo": "MC", "frecuencia": "Durante la fase de colocación de los paneles", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "9.8", "resumen": "Manchas de vegetación natural con refugios (bug-hotel) conservadas", "texto": "Se mantendrá o favorecerá el desarrollo, siempre que sea posible, de vegetación natural en los márgenes y en las calles intermedias entre filas de paneles. (Inf. IDAA: Se dejarán tres manchas de 100 m2 distribuidas por distintas zonas de los módulos fotovoltaicos donde existe vegetación natural que no se va a tocar y en cada mancha se instalarán estructuras tipo bug-hotel a modo de refugios para favorecer a los polinizadores. El seguimiento de estas manchas se incluirá en el Plan de Seguimiento y Vigilancia Ambiental).", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA   \n IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "9.9", "resumen": "Sin herbicidas; desbrozadora o pastoreo priorizado", "texto": "Dentro de la planta solar se procurará evitar la utilización de herbicidas para controlar la vegetación. Se recomienda el empleo de desbrozadora o pastoreo, priorizando siempre que sea posible el pastoreo.", "tipo": "MC", "frecuencia": "Al final de la obra Mensual", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 8, "nombre": "PATRIMONIO CULTURAL", "items": [{"codigo": "10.1", "resumen": "Control arqueológico de movimientos de tierra en yacimientos (buffer 25 m)", "texto": "Se deberá realizar un control arqueológico de los movimientos de tierra en el área que ocupa el yacimiento y un buffer en su entorno de 25m. (Inf. IDAA: A fin de garantizar la correcta documentación y protección de posibles evidencias arqueológicas no detectadas durante la fase de prospección, se propone como medida preventiva la realización de un seguimiento y control arqueológico periódico y puntual de los movimientos de tierra asociados a la ejecución de la planta solar fotovoltaica, fundamentalmente vinculados a los desbroces, apertura de viales y zanjas de baja y media tensión. Se hará hincapié en dicho control en el área que ocupa el yacimiento «Cerro Gordo» y en un buffer en su entorno de 25 m, así como en el yacimiento «Carre La Puebla», como asegurar la integridad de los elementos etnológico durante los trabajos de construcción de la planta, tal y como se establece en las resoluciones del Servicio Provincial de Cultura de Soria (Expediente RH-38/2023-5 de fechas 28 de abril de 2023 y 29 de mayo de 2023)).", "tipo": "MC", "frecuencia": "Semanal", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "10.2", "resumen": "Hallazgos arqueológicos comunicados de inmediato a Cultura", "texto": "Ante la aparición de algún resto se comunicará inmediatamente al Servicio Territorial de Cultura de Junta de Castilla y León y ésta tomará las medidas oportunas. (Inf. IDAA: Si durante el seguimiento y vigilancia de las obras se localizaran yacimientos arqueológicos no visualizados, su hallazgo será notificado inmediatamente al Servicio Territorial de Cultura de Soria, balizándose para evitar que sufran daños y se establecerán las medidas de protección que eviten la destrucción de los niveles arqueológicos, quedando a la espera de las indicaciones de la Administración competente en protección patrimonial)", "tipo": "MC", "frecuencia": "Semanal", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "10.3", "resumen": "Vías pecuarias delimitadas y señalizadas", "texto": "Se delimitarán y señalizarán las vías pecuarias existentes en la zona, evitando la afección a su trazado.", "tipo": "MP", "frecuencia": "Al inicio de la obra y semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "10.4", "resumen": "Sin ocupación de vías pecuarias sin autorización", "texto": "Se vigilará que no se ocupe ninguna vía pecuaria sin permiso concedido por el Servicio Territorial de Medio Ambiente de Junta de Castilla y León.", "tipo": "MP", "frecuencia": "Al inicio de la obra Semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "10.5", "resumen": "Estado y uso ganadero de vías pecuarias garantizado", "texto": "En relación a las vías pecuarias, deberán garantizarse el mantenimiento del correcto estado de estos bienes de dominio público, y que no se vea interrumpido el paso ganadero en ningún momento, tanto en explotación como en obra, así como garantizar los demás usos compatibles y complementarios según se recogen en la Ley 3/1995, de 23 de marzo, de Vías Pecuarias.", "tipo": "MP", "frecuencia": "Semanal", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 9, "nombre": "SOCIOECONOMÍA", "items": [{"codigo": "11.1", "resumen": "Transportes en horas de menor tráfico", "texto": "Se procurará que los trasportes por carretera se realicen en las horas de menor intensidad de tráfico.", "tipo": "MP", "frecuencia": "Semanal y al final de la obra.", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "11.2", "resumen": "Mojones y señales de delimitación de fincas/cotos/montes respetados", "texto": "Durante la fase de obras se señalizarán los mojones y señales de delimitación de fincas, cotos, montes etc.", "tipo": "MP", "frecuencia": "Al inicio de la obra y semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "11.3", "resumen": "Vías pecuarias delimitadas y señalizadas", "texto": "Se delimitarán y señalizarán las vías pecuarias existentes en la zona, evitando la afección a su trazado.", "tipo": "MP", "frecuencia": "Al inicio de la obra y semanal", "origen": "EsIA", "fase": "construccion", "faseOriginal": "Construcción"}]}, {"num": 10, "nombre": "PAISAJE", "items": [{"codigo": "12.1", "resumen": "Pantalla vegetal interior del cerramiento plantada", "texto": "Para mitigación del impacto visual se colocará una pantalla vegetal en el lado interior del cerramiento, de la misma altura del vallado y un espesor aproximado de 0,5 m. Las especies de plantas/arbolado para la realización de esta pantalla serán perennes y de especies autóctonas. (Inf. IDAA: Para asegurar un adecuado nivel de conectividad y favorecer al paisaje, se retranqueará el vallado 5 m hacia el interior de todo su perímetro llevándose a cabo la plantación de una franja de especies forestales a una densidad de 1.000 plantas/ha, de plantas de 2 savias, en contenedor de al menos 300 cm3 y protector de 50 cm de altura. La composición estaría formada por especies vegetales de la zona y aprobado por el Servicio Territorial de Medio Ambiente de Soria. Se deberá mantener en adecuado estado vegetativo para que cumpla con el objetivo de ser un corredor verde. El material forestal debe de cumplir con lo establecido en el Decreto 54/2007, de 24 de mayo, por el que se regula la comercialización de los materiales forestales de reproducción en la Comunidad de Castilla y León).", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "12.2", "resumen": "Partida económica de desmantelamiento y restauración prevista", "texto": "Se deberá de fijar una partida económica que cubra los gastos derivados del desmantelamiento de las instalaciones y el reacondicionamiento visual de la zona de implantación. (Inf. IDAA: Se presentará un Plan de Desmantelamiento y Restauración de los terrenos afectados por la planta fotovoltaica una vez finalice el periodo de vida útil de la planta, para que las afecciones que plantean se minimicen y sean temporales. Dicho plan deberá presentarse antes de finalizar la obra como máximo, incluyendo el compromiso de su realización por parte del promotor).", "tipo": "MCP", "frecuencia": "Previo al final de la obra", "origen": "EsIA    IDAA", "fase": "construccion", "faseOriginal": "Construcción"}, {"codigo": "12.3", "resumen": "Plantaciones en época adecuada (oct-abr), con mantenimiento", "texto": "Las plantaciones se realizarán en función de la climatología, entre los meses de octubre y abril y se deberá garantizar el mantenimiento (riegos, podas, etc.) de la misma durante la vida útil de la instalación. Se deberán reponer las marras producidas al año siguiente de la misma durante al menos los 10 primeros años de la plantación, admitiéndose unas marras de un máximo de un 10% del total de la planta o siempre que no se consiga el efecto de apantallamiento o de corredor con la vegetación superviviente. Este seguimiento deberá estar contemplado en el Plan de Vigilancia.", "tipo": "MC", "frecuencia": "Al final de la obra y periódico durante la explotación (al menos los 10 primeros años desde la ejecución de las plantaciones)", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "12.4", "resumen": "Cajas nido / refugios para fauna instalados; majanos mantenidos", "texto": "Para favorecer la utilización y relativa naturalización de la superficie vallada se procederá a la colocación en el entorno vallado o en otros puntos de la superficie de la planta de cajas nido, refugios para quirópteros u otro tipo de refugios para la fauna. Además, se procederá al mantenimiento de majanos existentes en la zona, que presenten vegetación arbórea y arbustiva, para mantener la biodiversidad de la zona.", "tipo": "MCP", "frecuencia": "Al final de la obra y durante la explotación", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "12.5", "resumen": "Restauración de superficies temporales afectadas", "texto": "La restauración deberá ir encaminada a la recuperación de las superficies temporales afectadas, especialmente las formaciones vegetales formadas por especies leñosas y hábitat de interés comunitario.", "tipo": "MC", "frecuencia": "Al final de la obra", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}, {"num": 11, "nombre": "SEGUIMIENTO AMBIENTAL DEL PROYECTO", "items": [{"codigo": "13.1", "resumen": "Documento de cumplimiento de medidas de restauración (previo a explotación)", "texto": "Tras las obras, antes del inicio de la actividad y dentro del primer informe del plan de vigilancia ambiental, se deberá elaborar un documento acerca del grado de cumplimiento de las medidas de restauración propuestas en el estudio de impacto ambiental, en aspectos tales como la gestión de las tierras (desbroces, acopios y almacenamiento de la tierra vegetal, preparación de suelo) y la regeneración de la vegetación en la planta fotovoltaica.", "tipo": "MS", "frecuencia": "Previo al inicio de la actividad", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Posterior a la construcción y previa a la explotación"}, {"codigo": "13.2", "resumen": "Impactos no previstos comunicados al órgano competente", "texto": "Si durante las actuaciones asociadas al presente proyecto se detectase algún impacto no analizado o cuya magnitud fuera superior a la evaluada se comunicará dicha circunstancia al órgano autonómico competente para la determinación de la forma de proceder.", "tipo": "MS", "frecuencia": "Cuando se detecte el impacto", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "13.3", "resumen": "Coordinación con las medidas de la parte eólica del proyecto", "texto": "Al tratarse de un proyecto de hibridación, las medidas y condiciones deben ir acordes en su conjunto, coordinadas y relacionadas en lo posible con las establecidas para la parte eólica del proyecto.", "tipo": "MS", "frecuencia": "Mensual", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "13.4", "resumen": "Medidas definidas y presupuestadas por el promotor", "texto": "Cada una de las medidas establecidas en el Estudio de impacto ambiental y en la Resolución del Informe de Determinación de Afección Ambiental deberán estar definidas y presupuestadas por el promotor en el proyecto o en una adenda al mismo, previamente a su aprobación. Será imprescindible un correcto desarrollo del Plan de Vigilancia Ambiental tanto en lo relacionado con las distintas fases del proyecto como con las medidas en él establecidas, relativas a periodos, plazos y seguimientos previstos.", "tipo": "MS", "frecuencia": "Previo al inicio de la actividad", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}, {"codigo": "13.5", "resumen": "Modificaciones significativas notificadas a la Administración", "texto": "Toda modificación significativa sobre las características de las actuaciones proyectadas, que pudiera producirse con posterioridad, deberá ser notificada a la Subdirección General de Calidad y Evaluación Ambiental que dictará su conformidad si procede, sin perjuicio de las licencias o permisos que, en su caso, correspondan.", "tipo": "MS", "frecuencia": "Cuando se produzca la modificación", "origen": "IDAA", "fase": "construccion", "faseOriginal": "Construcción y explotación"}]}];
